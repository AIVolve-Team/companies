schema: paperclip/v1
agents:
  cto:
    adapter:
      type: claude_local
      config:
        model: claude-opus-5
  staff-engineer:
    adapter:
      type: claude_local
      config:
        model: claude-sonnet-5
  code-reviewer:
    adapter:
      type: claude_local
      config:
        model: claude-sonnet-5
  release-engineer:
    adapter:
      type: claude_local
      config:
        model: claude-sonnet-5
    # The only agent that pushes, so the only one that declares a credential.
    # `optional` is deliberate, and the value is attached after import — see the README.
    inputs:
      env:
        GH_TOKEN:
          kind: secret
          requirement: optional
  qa-engineer:
    adapter:
      type: claude_local
      config:
        model: claude-sonnet-5
